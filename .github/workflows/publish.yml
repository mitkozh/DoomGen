on:
  push:
    tags:
      - 'doomgen-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check tag matches package version
        run: |
          uv run python -c 'import tomllib; print("pyproject version:", tomllib.load(open("pyproject.toml","rb"))["project"]["version"])'
          echo "tag: ${{ github.ref_name }}"
          test "doomgen-v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${{ github.ref_name }}"

      - name: Run tests
        run: uv run pytest tests -v

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
