name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest
          # Temporarily disabled: bundled ZDBSP is arm64-only on macOS.
          # - macos-15-intel
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests -v

  acc:
    name: ACC download and ACS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Cache ACC
        uses: actions/cache@v4
        with:
          path: ~/.cache/doomgen/tools/acc/1.60
          key: acc-1.60-${{ runner.os }}-${{ runner.arch }}

      - name: Install ACC
        run: uv run python -m doomgen.tools install acc

      - name: Run ACS tests
        run: uv run pytest tests/test_acs.py -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check src tests scripts setup.py

      - name: Format check
        run: uv run ruff format --check src tests scripts setup.py

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Typecheck
        run: uv run mypy src/doomgen

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build sdist
        run: uv build --sdist

      - name: Build platform wheels
        # macOS universal2 is added once zdbsp-macos is universal.
        run: |
          uv run python scripts/build_platform_wheels.py \
            --target win32 \
            --target win_amd64 \
            --target win_arm64 \
            --target manylinux_2_28_x86_64 \
            --target manylinux_2_28_aarch64

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/

  wheel-smoke:
    name: wheel smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: manylinux_2_28_aarch64
          - os: windows-latest
            target: win_amd64
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build wheel
        run: uv run python scripts/build_platform_wheels.py --target ${{ matrix.target }}

      - name: Install and run wheel
        shell: bash
        run: |
          uv venv .wheel-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.wheel-smoke/Scripts/python.exe
          else
            PYTHON=.wheel-smoke/bin/python
          fi
          uv pip install --python "$PYTHON" dist/*.whl
          "$PYTHON" scripts/smoke_wheel.py
