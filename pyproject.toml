[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doomgen"
version = "0.1.0"
description = "A Python library for seedable procedural generation of Doom WAD files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Anonymized Authors"}
]
keywords = ["doom", "wad", "procedural-generation", "marl", "reinforcement-learning", "doomgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies.
dependencies = [
    "omgifol>=0.5.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.0.0",
    "pillow>=12.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "matplotlib>=3.0.0",
    "pillow>=12.2.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/mitkozh/DoomGen"
Repository = "https://github.com/mitkozh/DoomGen"
Issues = "https://github.com/mitkozh/DoomGen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doomgen = ["bin/zdbsp/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.ruff]
target-version = "py311"
