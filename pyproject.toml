[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doomgen"
version = "1.0.0"
description = "A modular Python library for generating Doom WAD files, targeted at MARL benchmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.10"
authors = [
    {name = "Dimitar Zhekov", email = "mitko.zh@gmail.com"}
]
keywords = ["doom", "wad", "procedural-generation", "marl", "reinforcement-learning", "doomgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core runtime deps: only what src/doomgen imports.
# (networkx/pyyaml/vizdoom were unused; matplotlib/pillow only needed for
# visualization helpers and examples -> moved to the `viz` extra.)
dependencies = [
    "omgifol>=0.5.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.0.0",
    "pillow>=12.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "matplotlib>=3.0.0",
    "pillow>=12.2.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mitkozh/DoomGen"
Repository = "https://github.com/mitkozh/DoomGen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doomgen = ["bin/acc/*", "bin/zdbsp/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
